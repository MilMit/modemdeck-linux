name: Build Linux packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ubuntu-amd64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libgtk-4-dev libglib2.0-dev libudev-dev \
            modemmanager network-manager pkexec file librsvg2-dev \
            libgirepository1.0-dev desktop-file-utils libfuse2

      - name: Build Rust binary
        run: cargo build --release

      - name: Build Debian package
        run: ./packaging/build-deb.sh

      - name: Build AppImage
        run: ./packaging/build-appimage.sh

      - name: Build source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)"
          mkdir -p target/dist
          tar \
            --exclude='.git' \
            --exclude='target' \
            -czf "target/dist/MilMit-ModemDeck-${VERSION}-linux-source.tar.gz" .
          (cd target/dist && sha256sum MilMit-ModemDeck-* > SHA256SUMS.txt)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MilMit-ModemDeck-Linux-amd64
          path: target/dist/*

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" target/dist/* \
            --title "ModemDeck Linux ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Publish latest nightly prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "${GITHUB_SHA}"
          git push -f origin refs/tags/nightly
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly target/dist/* --clobber
            gh release edit nightly \
              --title "ModemDeck Linux Nightly" \
              --notes "Automated prerelease build from the latest main branch commit." \
              --prerelease
          else
            gh release create nightly target/dist/* \
              --title "ModemDeck Linux Nightly" \
              --notes "Automated prerelease build from the latest main branch commit." \
              --prerelease
          fi
