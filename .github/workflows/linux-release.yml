name: Linux quality and package build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit locked dependencies
        run: cargo audit

  linux-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libudev-dev libfontconfig1-dev \
            libxkbcommon-dev desktop-file-utils appstream dpkg-dev file libfuse2t64 \
            squashfs-tools patchelf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/net.milmit.ModemDeck.desktop
          appstreamcli validate --no-net --pedantic data/net.milmit.ModemDeck.metainfo.xml

      - name: Validate JSON data and version metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [path for path in Path('.').rglob('*.json')
                   if '.git' not in path.parts and 'target' not in path.parts]
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          print(f"Validated {len(files)} JSON files")
          PY
          ./scripts/validate-release.sh --metadata-only

      - name: Build release binary and Debian package
        run: |
          cargo build --release --locked
          ./packaging/build-deb.sh
          ./packaging/build-appimage.sh
          ./packaging/build-portable.sh
          if [[ "${{ matrix.arch }}" == aarch64 ]]; then
            expected_deb_arch=arm64
            file target/release/modemdeck | grep -qi aarch64
          else
            expected_deb_arch=amd64
            file target/release/modemdeck | grep -qi 'x86-64'
          fi
          deb="$(find target/dist -maxdepth 1 -name '*.deb' -print -quit)"
          [[ "$(dpkg-deb -f "$deb" Architecture)" == "$expected_deb_arch" ]]
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          mkdir -p target/package-smoke/deb
          dpkg-deb --extract "$deb" target/package-smoke/deb
          [[ "$(target/package-smoke/deb/usr/bin/modemdeck --version)" == "ModemDeck $version" ]]
          [[ "$(target/appimage/ModemDeck.AppDir/usr/bin/modemdeck --version)" == "ModemDeck $version" ]]
          tar -xzf "$(find target/dist -maxdepth 1 -name '*tar.gz' -print -quit)" -C target/package-smoke
          [[ "$(target/package-smoke/ModemDeck/bin/modemdeck --version)" == "ModemDeck $version" ]]

      - name: Create source archive for version tags
        if: startsWith(github.ref, 'refs/tags/v') && matrix.arch == 'x86_64'
        run: ./packaging/build-source.sh

      - name: Generate artifact checksums
        run: ./scripts/generate-checksums.sh target/dist

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ModemDeck-linux-${{ matrix.arch }}-${{ github.sha }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 14
