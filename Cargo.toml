[package]
name = "modemdeck"
version = "1.0.0-rc1.4.1"
edition = "2024"
description = "ModemDeck by MilMit — a lightweight graphical cellular modem manager for Linux"
license = "GPL-3.0-or-later"
homepage = "https://milmit.net"
authors = ["MilMit"]

[dependencies]
gtk = { package = "gtk4", version = "0.11" }
gio = "0.22"
glib = "0.22"
glib-unix = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
