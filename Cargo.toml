[package]
name = "modemdeck"
version = "2.0.0-beta.1"
edition = "2024"
description = "ModemDeck by MilMit — modern cross-platform cellular modem manager & network analyzer powered by Rust and Slint"
license = "GPL-3.0-or-later"
homepage = "https://milmit.net"
authors = ["MilMit"]
rust-version = "1.95"

[dependencies]
slint = "1.19.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
serialport = { version = "4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
zbus = { version = "6.5", features = ["tokio"] }
rusqlite = { version = "0.43", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.8", default-features = false, features = ["blocking"] }

[build-dependencies]
slint-build = "1.19.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
