<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280" role="img" aria-label="ModemDeck v2.0 Animated Hero Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#091322"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="waveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="280" rx="20" fill="url(#bgGrad)" stroke="#1e2d4a" stroke-width="1.5"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#1b2944" stroke-width="1" opacity="0.55">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="900" y1="0" x2="900" y2="280"/>
  </g>

  <!-- Animated Signal Telemetry Wave -->
  <path d="M 0 235 Q 150 185 300 210 T 600 180 T 900 205 T 1200 175 L 1200 280 L 0 280 Z" fill="url(#waveFill)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M 0 235 Q 150 185 300 210 T 600 180 T 900 205 T 1200 175 L 1200 280 L 0 280 Z;
              M 0 220 Q 150 210 300 175 T 600 205 T 900 175 T 1200 195 L 1200 280 L 0 280 Z;
              M 0 235 Q 150 185 300 210 T 600 180 T 900 205 T 1200 175 L 1200 280 L 0 280 Z"/>
  </path>
  <path d="M 0 235 Q 150 185 300 210 T 600 180 T 900 205 T 1200 175" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.9">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M 0 235 Q 150 185 300 210 T 600 180 T 900 205 T 1200 175;
              M 0 220 Q 150 210 300 175 T 600 205 T 900 175 T 1200 195;
              M 0 235 Q 150 185 300 210 T 600 180 T 900 205 T 1200 175"/>
  </path>

  <!-- Animated Cellular Signal Bars Icon -->
  <g transform="translate(64, 72)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#101a2e" stroke="#284066" stroke-width="1.5"/>
    <g transform="translate(22, 24)">
      <rect x="0" y="34" width="8" height="14" rx="3" fill="#38bdf8">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="14" y="24" width="8" height="24" rx="3" fill="#38bdf8">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="28" y="14" width="8" height="34" rx="3" fill="#2563eb">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="42" y="2" width="8" height="46" rx="3" fill="#10b981" filter="url(#glow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Title & Subtitle -->
  <text x="188" y="106" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="42" font-weight="800" fill="#f8fafc">
    ModemDeck <tspan fill="#38bdf8" font-size="24" font-weight="700">v2.0</tspan>
  </text>
  <text x="188" y="140" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
    Native Rust + Slint Cellular Modem Control Suite — LTE, TD-LTE, 4G+ CA &amp; 5G NR
  </text>

  <!-- Live Status Pills -->
  <g transform="translate(188, 162)">
    <rect x="0" y="0" width="136" height="30" rx="15" fill="#10b981" fill-opacity="0.16" stroke="#10b981" stroke-opacity="0.5"/>
    <circle cx="16" cy="15" r="4.5" fill="#10b981">
      <animate attributeName="r" values="3.5;5;3.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#34d399">Rust + Slint 1.19</text>

    <rect x="148" y="0" width="154" height="30" rx="15" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="166" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Zero GTK4 / Electron</text>

    <rect x="314" y="0" width="166" height="30" rx="15" fill="#2563eb" fill-opacity="0.20" stroke="#60a5fa" stroke-opacity="0.5"/>
    <text x="332" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#93c5fd">8 Languages + Full RTL</text>

    <rect x="492" y="0" width="142" height="30" rx="15" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="510" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">by MilMit • milmit.net</text>
  </g>
</svg>
