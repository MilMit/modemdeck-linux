name: modemdeck
base: core24
version: '2.0.0-beta.1'
summary: Cross-platform cellular modem manager & analyzer by MilMit
description: |
  ModemDeck is a modern Rust + Slint cellular modem manager for Linux with live
  signal telemetry, safe band controls, global operator & Auto APN database,
  SMS/USSD/voice controls, System Tray, Modem Doctor, and multi-vendor diagnostics.
grade: devel
confinement: strict

apps:
  modemdeck:
    command: usr/bin/modemdeck
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - network
      - network-manager
      - modem-manager
      - serial-port
      - raw-usb
      - hardware-observe

parts:
  modemdeck:
    plugin: rust
    source: ..
    build-packages:
      - pkg-config
      - libfontconfig-dev
      - libxkbcommon-dev
      - libudev-dev
    stage-packages:
      - libfontconfig1
      - libxkbcommon0
    override-build: |
      craftctl default
      install -Dm755 target/release/modemdeck "$CRAFT_PART_INSTALL/usr/bin/modemdeck"
      install -Dm644 data/net.milmit.ModemDeck.desktop "$CRAFT_PART_INSTALL/usr/share/applications/net.milmit.ModemDeck.desktop"
      install -Dm644 data/net.milmit.ModemDeck.metainfo.xml "$CRAFT_PART_INSTALL/usr/share/metainfo/net.milmit.ModemDeck.metainfo.xml"
      install -Dm644 assets/icons/net.milmit.ModemDeck.svg "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/net.milmit.ModemDeck.svg"
